{% extends "base.html" %}


{% block content %}


<h1>
    Candidate Profile
</h1>


<form method="POST" action="/profile">


<div class="mb-3">

<label class="form-label">
First Name
</label>

<input 
type="text"
name="first_name"
value = "{{profile.first_name if profile else ''}}"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Last Name
</label>

<input 
type="text"
name="last_name"
value = "{{profile.last_name if profile else ''}}"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Location
</label>

<input 
type="text"
name="location"
value = "{{profile.location if profile else ''}}"
class="form-control">

</div>




<div class="mb-3">

<label class="form-label">
Target Role
</label>

<input 
type="text"
name="target_role"
class="form-control"
value = "{{profile.target_role if profile else ''}}"
placeholder="AI Engineer">

</div>




<div class="mb-3">

<label class="form-label">
Years Experience
</label>

<input 
type="number"
name="years_experience"
value = "{{profile.years_experience if profile else ''}}"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Professional Summary
</label>

<textarea
name="summary"
class="form-control"
rows="4">{{profile.summary if profile else ''}}
</textarea>

</div>



<button class="btn btn-primary">

Save Profile

</button>


</form>

<hr class="my-5">


<h3>
    Skills
</h3>



<table class="table">


<tr>

<th>
Skill
</th>

<th>
Level
</th>

</tr>


{% for skill in skills %}


<tr>

<td>
{{ skill.skill_name }}
</td>


<td>
{{ skill.skill_level }}
</td>


</tr>


{% endfor %}


</table>





<h4 class="mt-4">
Add Skill
</h4>


<form method="POST" action="/add-skill">


<div class="mb-3">


<label>
Skill Name
</label>


<input
type="text"
name="skill_name"
class="form-control"
placeholder="Python">


</div>



<div class="mb-3">


<label>
Skill Level
</label>


<select
name="skill_level"
class="form-control">


<option>
Beginner
</option>


<option>
Intermediate
</option>


<option>
Advanced
</option>


</select>


</div>



<button class="btn btn-success">

Add Skill

</button>


</form>

<a href="/preferences" class="btn btn-outline-primary">
Edit Preferences
</a>

</br>

<a href="/resume" class="btn btn-success">
Upload Resume
</a>

<br/><br/>

{% endblock %}
