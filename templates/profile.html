{% extends "base.html" %}


{% block content %}


<h1>
    Candidate Profile
</h1>


<form>


<div class="mb-3">

<label class="form-label">
First Name
</label>

<input 
type="text"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Last Name
</label>

<input 
type="text"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Location
</label>

<input 
type="text"
class="form-control">

</div>




<div class="mb-3">

<label class="form-label">
Target Role
</label>

<input 
type="text"
class="form-control"
placeholder="AI Engineer">

</div>




<div class="mb-3">

<label class="form-label">
Years Experience
</label>

<input 
type="number"
class="form-control">

</div>



<div class="mb-3">

<label class="form-label">
Professional Summary
</label>

<textarea
class="form-control"
rows="4">
</textarea>

</div>



<button class="btn btn-primary">

Save Profile

</button>


</form>



{% endblock %}
