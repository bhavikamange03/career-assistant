{% extends "base.html" %}


{% block content %}


<h1>
Career Preferences
</h1>



<form method="POST" action="/preferences">


<div class="mb-3">

<label>
Preferred Location
</label>

<input
type="text"
name="preferred_location"
class="form-control"
placeholder="California">


</div>




<div class="mb-3">

<label>
Remote Preference
</label>


<select
name="remote_preference"
class="form-control">


<option>
Remote
</option>


<option>
Hybrid
</option>


<option>
On-site
</option>


</select>


</div>





<div class="mb-3">

<label>
Target Salary
</label>


<input

type="number"

name="target_salary"

class="form-control"

placeholder="150000">


</div>





<div class="mb-3">

<label>
Job Type
</label>


<select
name="job_type"
class="form-control">


<option>
Full-time
</option>


<option>
Contract
</option>


<option>
Part-time
</option>


</select>


</div>




<div class="form-check mb-3">


<input

class="form-check-input"

type="checkbox"

name="sponsorship_required">


<label>

Need Sponsorship

</label>


</div>




<button class="btn btn-primary">

Save Preferences

</button>


</form>


{% endblock %}
