{% extends "base.html" %}


{% block content %}


<h1>
Resume
</h1>


<form method="POST" enctype="multipart/form-data">


<div class="mb-3">

<label>
Upload Resume
</label>

<input
type="file"
name="resume"
class="form-control"
accept=".pdf">

</div>


<button class="btn btn-primary">
Upload Resume
</button>


</form>


<hr>


<h3>
Current Resume
</h3>


{% if resume %}

<div class="card p-3">

<p>
{{ resume[0].file_name }}
</p>


<a 
href="/resume/view/{{ resume[0].id }}"
target="_blank"
class="btn btn-success">

View Resume PDF

</a>


</div>


{% else %}

<p>
No resume uploaded yet.
</p>


{% endif %}


{% endblock %}
