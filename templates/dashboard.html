{% extends "base.html" %}


{% block content %}


<div class="text-center mb-4">


    <h1>
        Welcome to Career Copilot 🚀
    </h1>


    <p class="lead">

        Your AI-powered career assistant

    </p>


</div>




<div class="row">



    <div class="col-md-3">


        <div class="card shadow-sm">


            <div class="card-body text-center">


                <h5>
                    Profile
                </h5>


                <p>
                    Not Completed
                </p>


                <button class="btn btn-primary">
                    Complete Profile
                </button>


            </div>


        </div>


    </div>





    <div class="col-md-3">


        <div class="card shadow-sm">


            <div class="card-body text-center">


                <h5>
                    Resume
                </h5>


                <p>
                    Not Uploaded
                </p>


                <button class="btn btn-success">
                    Upload Resume
                </button>


            </div>


        </div>


    </div>





    <div class="col-md-3">


        <div class="card shadow-sm">


            <div class="card-body text-center">


                <h5>
                    Saved Jobs
                </h5>


                <p>
                    0
                </p>


                <button class="btn btn-warning">
                    View Jobs
                </button>


            </div>


        </div>


    </div>





    <div class="col-md-3">


        <div class="card shadow-sm">


            <div class="card-body text-center">


                <h5>
                    Applications
                </h5>


                <p>
                    0
                </p>


                <button class="btn btn-danger">
                    Track
                </button>


            </div>


        </div>


    </div>



</div>



<hr class="my-5">



<h3>
    AI Career Assistant
</h3>


<div class="alert alert-info">

    🤖 Upload your resume and let AI find matching opportunities.

</div>



{% endblock %}
