<h1>Remote Jobs</h1>


{% for job in jobs %}

<div>

<h3>{{job.title}}</h3>

<p>
Company:
{{job.company}}
</p>

<p>
Location:
{{job.location}}
</p>

<a href="{{job.url}}" target="_blank">
View Job
</a>

<hr>

<form action="/save-job" method="POST">

<input 
    type="hidden" 
    name="job_id" 
    value="{{job.id}}"
/>

<button type="submit">
    Save Job
</button>

</form>

<hr>
</div>


{% endfor %}
